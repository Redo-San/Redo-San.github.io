version: 2
updates:
  # The landing surface ships GitHub Actions only (CodeQL today); keep the
  # SHA-pinned actions current with the same cadence as the main project.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
    # CodeQL's init and analyze must resolve to the same version, so Dependabot
    # has to move them together. Ungrouped it opens two PRs that each fail with
    # "Loaded a configuration file for version '4.37.8', but running version
    # '4.37.7'" -- that was #6, then #13/#14 again. One group, one atomic PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
