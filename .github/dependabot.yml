version: 2
updates:
  # The landing surface ships GitHub Actions only (CodeQL today); keep the
  # SHA-pinned actions current with the same cadence as the main project.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - "ci"
    commit-message:
      prefix: "chore"
      include: "scope"
