<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; connect-src 'none'; object-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f1a">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5fa">
  <meta name="robots" content="noindex">
  <title>404 — RedoSan Authenticity</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #0f0f1a; color: #e8e8f0; min-height: 100vh; display: grid;
           place-items: center; text-align: center; padding: 24px; }
    h1 { font-size: 4rem; margin-bottom: 8px; color: #6c5ce7; }
    p { color: #9b9bb5; margin-bottom: 22px; line-height: 1.6; }
    a.btn { display: inline-block; padding: 12px 26px; border-radius: 12px;
            background: #6c5ce7; color: #fff; text-decoration: none; font-weight: 600; }
    code { background: #1a1a2e; padding: 2px 7px; border-radius: 6px; font-size: .9em; }
  </style>
  <script>
    // GitHub Pages serves this file for every unmatched path on the host.
    // Preserve deep links by mapping the attempted path onto the app:
    //   /watermark            -> /RedoSan-Authenticity/watermark
    //   /Style/pages/c2pa/... -> /RedoSan-Authenticity/Style/pages/c2pa/...
    (function () {
      var path = location.pathname.replace(/^\/+/, "");
      if (!path || /^index\.html?$/i.test(path) || /^404\.html$/i.test(path)) {
        location.replace("/RedoSan-Authenticity/");
        return;
      }
      location.replace("/RedoSan-Authenticity/" + path + location.search);
    })();
  </script>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page does not exist at the host root.<br>
       Taking you to the RedoSan Authenticity app<span id="tried"></span>…</p>
    <noscript><p>JavaScript is disabled — use the button below.</p></noscript>
    <noscript><a class="btn" href="/RedoSan-Authenticity/">Open the app</a></noscript>
    <script>
      document.getElementById("tried").textContent =
        " (" + location.pathname.replace(/^\/+/, "") + ")";
    </script>
    <p style="margin-top:18px"><a class="btn" href="/RedoSan-Authenticity/">Open manually</a></p>
  </div>
</body>
</html>
